[package]
name = "world-kernel"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Experimental runtime for grounded, admitted, replayable changes"
repository = "https://github.com/memolabs-dev/world-kernel"
readme = "README.md"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

# The check-1 consumer lives in its own crate, outside `tests/`, and is depended on only by the
# experiment that measures it. A dev-dependency cycle is legal in cargo and is what makes the consumer
# external: it can reach `world_kernel::experience` and nothing else in this repository.
[dev-dependencies]
consumer-transfer = { path = "experiments/consumer-transfer" }
